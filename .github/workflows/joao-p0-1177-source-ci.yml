name: João P0 1177 source CI

on:
  push:
    branches:
      - p0/1177-live-v335-owner
    paths:
      - 'patches/joao-p0-1177-live-v335/**'
      - 'test/joao-p0-1177-live-v335.test.mjs'
      - '.github/workflows/joao-p0-1177-source-ci.yml'
  pull_request:
    paths:
      - 'patches/joao-p0-1177-live-v335/**'
      - 'test/joao-p0-1177-live-v335.test.mjs'
      - '.github/workflows/joao-p0-1177-source-ci.yml'

permissions:
  contents: read

jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run P0 1177 deterministic source replay
        run: node --test test/joao-p0-1177-live-v335.test.mjs
