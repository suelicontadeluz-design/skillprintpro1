name: Generate clean João freight choice patch

on:
  push:
    branches:
      - fix/joao-freight-choice-v2-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact fail-closed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          p = Path('patches/joao-slot-proveniencia-escrita/candidato/index.ts')
          s = p.read_text()

          def exactly(old: str, new: str, label: str):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {n}')
              s = s.replace(old, new, 1)

          exactly("const V = 'agente-noturno-v4.37.4-canonical-price';", "const V = 'agente-noturno-v4.37.5-freight-choice';", 'agent version')
          exactly("  { name: 'calcular_frete', description: 'Frete Correios por CEP de 8 digitos. CHAME de verdade, nunca prometa calcular depois.', input_schema: { type: 'object', properties: { cep_destino: { type: 'string' } }, required: ['cep_destino'] } },", "  { name: 'calcular_frete', description: 'Frete por CEP de 8 digitos. PRIMEIRA chamada: envie somente cep_destino para COTAR e mostrar as opcoes; isso NAO cria autorizacao financeira. SOMENTE depois de o CLIENTE escolher explicitamente PAC, Sedex ou J&T Standard, chame de novo com cep_destino + servico_escolhido exatamente igual a opcao escolhida. Nunca escolha pelo cliente.', input_schema: { type: 'object', properties: { cep_destino: { type: 'string' }, servico_escolhido: { type: 'string', enum: ['PAC', 'Sedex', 'J&T Standard'] } }, required: ['cep_destino'] } },", 'tool schema')
          exactly("async function executarTool(name: string, input: any, ctx: { leadId: string | null; autorizacoes: any[]; cobrancaPendente: any | null; permiteMudanca: boolean; freteJa: any | null; arteParaCalculo?: { largura_cm: number; altura_cm: number; copias: number } | null; phone?: string; pixGerado?: any; holdArte?: boolean; modalidadeLogistica?: ModalidadeLogistica; produtoDigital?: boolean }): Promise<string> {", "async function executarTool(name: string, input: any, ctx: { leadId: string | null; autorizacoes: any[]; cobrancaPendente: any | null; permiteMudanca: boolean; freteJa: any | null; arteParaCalculo?: { largura_cm: number; altura_cm: number; copias: number } | null; phone?: string; pixGerado?: any; holdArte?: boolean; modalidadeLogistica?: ModalidadeLogistica; produtoDigital?: boolean; mensagemCliente?: string }): Promise<string> {", 'ctx signature')
          exactly("produtoDigital: estadoLog.produto_digital };", "produtoDigital: estadoLog.produto_digital, mensagemCliente: mensagem };", 'current inbound')

          start_marker = "    if (name === 'calcular_frete') {\n"
          end_marker = "      return envelope([opF], dsp);\n    }"
          if s.count(start_marker) != 1:
              raise SystemExit(f'freight block start expected exactly 1, got {s.count(start_marker)}')
          start = s.index(start_marker)
          end0 = s.index(end_marker, start)
          end = end0 + len(end_marker)
          old_block = s[start:end]
          if 'const sedex = d.opcoes.find' not in old_block or 'const melhor = sedex' not in old_block:
              raise SystemExit('old Sedex preselection logic not found')

          new_block_b64 = ''
          new_block = base64.b64decode(new_block_b64).decode()
          if hashlib.sha256(new_block.encode()).hexdigest() != '282152a362a1be878f3472c6fad75c281c06d289872c79e684f79da4024f77a9':
              raise SystemExit('new freight block hash mismatch')
          s = s[:start] + new_block + s[end:]

          exactly("ENVIO: reutilize o CEP que voc\\u00ea j\\u00e1 tem, ou pe\\u00e7a UMA vez, e s\\u00f3 ent\\u00e3o calcular_frete -> TOTAL = produto + frete.", "ENVIO: reutilize o CEP que voc\\u00ea j\\u00e1 tem, ou pe\\u00e7a UMA vez. Primeiro chame calcular_frete SO com o CEP para COTAR, mostre TODAS as opcoes e aguarde a escolha. So depois de o CLIENTE escrever explicitamente PAC, Sedex ou J&T, chame calcular_frete de novo com servico_escolhido -> TOTAL = produto + frete escolhido. NUNCA escolha frete pelo cliente.", 'closing prompt')
          exactly("!/PAC|Sedex|SEDEX|frete/i.test(resposta)", "!/PAC|Sedex|SEDEX|J\\s*&\\s*T|J&T|frete/i.test(resposta)", 'retry condition')
          exactly("/PAC|Sedex|SEDEX/i.test(r4)", "/PAC|Sedex|SEDEX|J\\s*&\\s*T|J&T/i.test(r4)", 'retry acceptance')

          if 'const melhor = sedex' in s:
              raise SystemExit('Sedex preselection survived')
          if "const cep = String(input?.cep_destino || '').replace(/\\D/g, '');" not in s:
              raise SystemExit('expected clean CEP line missing')
          if 'servico_frete_sem_escolha_cliente' not in s or 'escolha_cliente: true' not in s:
              raise SystemExit('freight provenance guard missing')
          p.write_text(s)
          PY

          grep -F "const V = 'agente-noturno-v4.37.5-freight-choice';" patches/joao-slot-proveniencia-escrita/candidato/index.ts
          grep -F "servico_frete_sem_escolha_cliente" patches/joao-slot-proveniencia-escrita/candidato/index.ts
          grep -F "escolha_cliente: true" patches/joao-slot-proveniencia-escrita/candidato/index.ts

      - name: Commit generated patch and retire generator
        shell: bash
        run: |
          rm .github/workflows/patch-joao-freight-choice-v2-20260908.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches/joao-slot-proveniencia-escrita/candidato/index.ts .github/workflows/patch-joao-freight-choice-v2-20260908.yml
          git commit -m 'fix(joao): authorize only customer-selected freight'
          git push origin HEAD:${GITHUB_REF_NAME}
