name: security-zapi-ingest-auth-live

on:
  push:
    branches:
      - security/zapi-ingest-auth-live
    paths:
      - '.github/workflows/security-zapi-ingest-auth-live.yml'

permissions:
  contents: read

jobs:
  patch-live-function:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABASE_TOKEN || secrets.SUPABASE_PAT }}
      PROJECT_REF: ldrdtaibazplvrbwyrvx
    steps:
      - uses: actions/checkout@v4

      - name: Fail closed if management token is unavailable
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'SUPABASE_ACCESS_TOKEN ausente'; exit 2; }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download current LIVE zapi-ingest
        shell: bash
        run: |
          set -euo pipefail
          supabase functions download zapi-ingest --project-ref "$PROJECT_REF" --use-api
          test -f supabase/functions/zapi-ingest/index.ts

      - name: Apply one narrow authentication guard
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          p = Path('supabase/functions/zapi-ingest/index.ts')
          src = p.read_text()
          needle = '''Deno.serve(async (req) => {
            if (req.method !== "POST") return new Response("Method not allowed", { status: 405 });
            let body: any;'''
          guard = '''Deno.serve(async (req) => {
            if (req.method !== "POST") return new Response("Method not allowed", { status: 405 });
            const auth = req.headers.get("authorization") || "";
            if (auth !== `Bearer ${SUPABASE_SERVICE_KEY}`) {
              return new Response(JSON.stringify({ error: "unauthorized" }), {
                status: 401,
                headers: { "Content-Type": "application/json" },
              });
            }
            let body: any;'''

          if src.count(needle) != 1:
              raise SystemExit(f'FAIL_CLOSED: marker count={src.count(needle)}')
          if 'auth !== `Bearer ${SUPABASE_SERVICE_KEY}`' in src:
              raise SystemExit('FAIL_CLOSED: guard already present unexpectedly')

          patched = src.replace(needle, guard, 1)
          if patched.replace(guard, needle, 1) != src:
              raise SystemExit('FAIL_CLOSED: patch changed more than intended')

          p.write_text(patched)
          print('source_sha256_before=' + hashlib.sha256(src.encode()).hexdigest())
          print('source_sha256_after=' + hashlib.sha256(patched.encode()).hexdigest())
          print('patch_ok=one_guard_only')

      - name: Deploy patched function preserving custom auth mode
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy zapi-ingest --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      - name: Prove direct anonymous POST is blocked
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' \
            -X POST "https://${PROJECT_REF}.supabase.co/functions/v1/zapi-ingest" \
            -H 'Content-Type: application/json' \
            --data '{}')
          cat "$out"
          echo
          echo "HTTP=$code"
          test "$code" = '401'
