name: Generate João canonical price patch

on:
  push:
    branches:
      - fix/joao-canonical-price-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact fail-closed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('patches/joao-slot-proveniencia-escrita/candidato/index.ts')
          s = p.read_text()

          def exactly(old: str, new: str, label: str):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {n}')
              s = s.replace(old, new, 1)

          def required(old: str, new: str, label: str):
              global s
              n = s.count(old)
              if n < 1:
                  raise SystemExit(f'{label}: expected >=1 occurrence, got 0')
              s = s.replace(old, new)

          exactly(
              "const V = 'agente-noturno-v4.37.3';",
              "const V = 'agente-noturno-v4.37.4-canonical-price';",
              'version',
          )
          exactly(
              '  2990, 3990,              // folha A4 e folha A3 de DTF UV',
              '  2990, 3900,              // folha A4 e folha A3 de DTF UV',
              'speech_price_set',
          )
          exactly(
              '  2990, 3990,        // folha A4 e folha A3 de DTF UV',
              '  2990, 3900,        // folha A4 e folha A3 de DTF UV',
              'closed_price_set',
          )
          exactly(
              "        const FONTES_UNIDADE_FECHADA = (f: string) =>\n          f === 'ficha_preco_fechado'\n          || f === 'dtf_uv_degraus'\n          || (f === 'catalogo_produtos' && !produtoGuarda);",
              "        const FONTES_UNIDADE_FECHADA = (f: string) =>\n          f === 'dtf_uv_degraus'\n          || f === 'catalogo_produtos';",
              'canonical_sources',
          )
          exactly(
              "        const ehProduto = soUm\n          && !valorEUnitario\n          && PRECOS_FICHA_FECHADOS.has(conferidos[0].centavos)\n          && FONTES_UNIDADE_FECHADA(conferidos[0].fonte);",
              "        const ehProduto = soUm\n          && !valorEUnitario\n          && FONTES_UNIDADE_FECHADA(conferidos[0].fonte);",
              'product_authorization',
          )
          required('A3 R$39,90', 'A3 R$39,00', 'a3_prompt_price')
          required('A3 de R$39,90', 'A3 de R$39,00', 'a3_example_price')

          p.write_text(s)
          PY

          grep -F "const V = 'agente-noturno-v4.37.4-canonical-price';" patches/joao-slot-proveniencia-escrita/candidato/index.ts
          grep -F "f === 'dtf_uv_degraus'" patches/joao-slot-proveniencia-escrita/candidato/index.ts
          if grep -Fq "A3 R$39,90" patches/joao-slot-proveniencia-escrita/candidato/index.ts; then
            echo 'stale A3 prompt price remains' >&2
            exit 1
          fi
          if grep -Fq "A3 de R$39,90" patches/joao-slot-proveniencia-escrita/candidato/index.ts; then
            echo 'stale A3 example price remains' >&2
            exit 1
          fi

      - name: Commit generated patch and retire generator
        shell: bash
        run: |
          rm .github/workflows/patch-joao-canonical-price-20260908.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches/joao-slot-proveniencia-escrita/candidato/index.ts .github/workflows/patch-joao-canonical-price-20260908.yml
          git commit -m 'fix(joao): ground A3 price in canonical sources'
          git push origin HEAD:${GITHUB_REF_NAME}
