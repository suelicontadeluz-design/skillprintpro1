# trigger do runner temporario definido no main
name: patch-produto-canonico

on:
  push:
    branches:
      - joao-fix-produto-canonico-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joao-fix-produto-canonico-20260913
          fetch-depth: 1

      - name: Guard rail local
        run: echo "patch aplicado pelo runner temporario do main"
