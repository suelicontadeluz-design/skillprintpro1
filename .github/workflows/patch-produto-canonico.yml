name: patch-produto-origem-candidato

on:
  push:
    branches:
      - joao-fix-produto-canonico-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joao-fix-produto-canonico-20260913
          fetch-depth: 20
      - name: Corrigir precedencia do anuncio real
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/joao-slot-proveniencia-escrita/candidato/index.ts')
          s = p.read_text(encoding='utf-8')
          old = "const prodOrigem = (anuncioRecente && prodAnuncio) ? prodAnuncio : (prodCategoria || prodAnuncio);"
          new = "const prodOrigem = prodAnuncio || prodCategoria;"
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'ancora prodOrigem esperada 1x, encontrada {n}x')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- patches/joao-slot-proveniencia-escrita/candidato/index.ts
      - name: Commit candidato corrigido
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/joao-slot-proveniencia-escrita/candidato/index.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "patches/joao-slot-proveniencia-escrita/candidato/index.ts"
          git commit -m "fix(joao): preferir anuncio real na origem canonica"
          git push origin HEAD:joao-fix-produto-canonico-20260913
