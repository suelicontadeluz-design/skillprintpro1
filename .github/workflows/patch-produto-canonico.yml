name: patch-produto-canonico

on:
  push:
    branches:
      - joao-fix-produto-canonico-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joao-fix-produto-canonico-20260913
          fetch-depth: 1

      - name: Aplicar patch por ancoras exatas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('patches/joao-slot-proveniencia-escrita/candidato/index.ts')
          s = p.read_text(encoding='utf-8')

          old1 = """  const provSlots = filtrarSlotsPorProveniencia({
            anteriores: slotsAnteriores,
            recebidos: decisao.slots || {},
          """
          new1 = """  // Produto canonico: resolver deterministico ja existente -> slot persistido.
          // Precedencia: mensagem explicita do cliente > anuncio de origem (somente sem produto anterior)
          // > slot do modelo submetido ao filtro de proveniencia ja existente.
          const produtoMacroAnteriorResolvido = normalizarProdutoMacro(slotsAnteriores.produto);
          const produtoMacroMensagemResolvido = normalizarProdutoMacro(prodMsg);
          const produtoMacroOrigemResolvido = normalizarProdutoMacro(prodOrigem);
          const produtoDeterministico = produtoMacroMensagemResolvido
            || (!produtoMacroAnteriorResolvido ? produtoMacroOrigemResolvido : null);
          const produtoDeterministicoFonte = produtoMacroMensagemResolvido
            ? 'mensagem_cliente'
            : (!produtoMacroAnteriorResolvido && produtoMacroOrigemResolvido ? 'anuncio' : null);
          const slotsParaProveniencia = {
            ...(decisao.slots || {}),
            ...(produtoDeterministico ? { produto: produtoDeterministico } : {}),
          };

          const provSlots = filtrarSlotsPorProveniencia({
            anteriores: slotsAnteriores,
            recebidos: slotsParaProveniencia,
          """
          if s.count(old1) != 1:
              raise SystemExit(f'ancora 1 esperada 1x, encontrada {s.count(old1)}x')
          s = s.replace(old1, new1, 1)

          old2 = """  const slotsNovos: any = {
            ...slotsAnteriores,
            ...slotsRecebidos,
            grade: (Array.isArray(slotsRecebidos.grade) && slotsRecebidos.grade.length > 0) ? slotsRecebidos.grade : slotsAnteriores.grade,
            estampas: (Array.isArray(slotsRecebidos.estampas) && slotsRecebidos.estampas.length > 0) ? slotsRecebidos.estampas : slotsAnteriores.estampas,
          };
          """
          new2 = old2 + """
          // Proveniencia observavel sem alterar o schema do estado: registra somente quando
          // um produto canonico novo/mudado foi efetivamente aceito e persistido.
          const produtoMacroDepoisResolvido = normalizarProdutoMacro(slotsNovos.produto);
          const produtoFontePersistida = produtoMacroDepoisResolvido
            && produtoMacroDepoisResolvido !== produtoMacroAnteriorResolvido
            && slotsRecebidos.produto !== undefined
              ? (produtoDeterministico
                  && produtoMacroDepoisResolvido === produtoDeterministico
                    ? produtoDeterministicoFonte
                    : 'modelo_slot')
              : null;
          if (!dryRun && produtoFontePersistida) {
            await logErro('produto_proveniencia_resolvida', {
              phone: phone.slice(-4),
              turn_id: obsTurnId,
              produto_macro: produtoMacroDepoisResolvido,
              fonte: produtoFontePersistida,
            });
          }
          """
          if s.count(old2) != 1:
              raise SystemExit(f'ancora 2 esperada 1x, encontrada {s.count(old2)}x')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git diff -- patches/joao-slot-proveniencia-escrita/candidato/index.ts

      - name: Commit do candidato
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/joao-slot-proveniencia-escrita/candidato/index.ts
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao a commitar"
            exit 0
          fi
          git commit -m "fix(joao): persistir produto canonico com proveniencia"
          git push origin HEAD:joao-fix-produto-canonico-20260913
