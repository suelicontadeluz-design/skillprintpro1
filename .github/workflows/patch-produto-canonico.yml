name: rebuild-produto-canonico-replay-candidate

on:
  push:
    branches:
      - joao-fix-produto-canonico-20260913

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joao-fix-produto-canonico-20260913
          fetch-depth: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Aplicar precedencia estrita no core
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('patches/joao-slot-proveniencia-escrita/candidato/index.ts')
          s = p.read_text(encoding='utf-8')

          lateral = "  const prodOrigem = prodAnuncio || prodCategoria;"
          canonica = "  const prodOrigem = (anuncioRecente && prodAnuncio) ? prodAnuncio : (prodCategoria || prodAnuncio);"
          if s.count(lateral) != 1:
              raise SystemExit(f'prodOrigem lateral esperado 1x, encontrado {s.count(lateral)}x')
          s = s.replace(lateral, canonica, 1)

          ini = "  // Produto canonico: resolver deterministico ja existente -> slot persistido.\n"
          fim = "\n  const provSlots = filtrarSlotsPorProveniencia({"
          if s.count(ini) != 1 or s.count(fim) != 1:
              raise SystemExit(f'bloco resolver ambiguo: ini={s.count(ini)} fim={s.count(fim)}')
          a = s.index(ini)
          b = s.index(fim, a)
          resolver = '''  // Produto canonico: resolver deterministico ja existente -> slot persistido.
  // Precedencia estrita: mensagem explicita > estado anterior aceito > anuncio/origem > modelo filtrado.
  // Qualquer fonte deterministica substitui apenas a PROPOSTA do modelo antes da porta de proveniencia;
  // o merge final continua sendo o mesmo e anuncio nunca rebaixa um produto anterior aceito.
  const produtoMacroAnteriorResolvido = normalizarProdutoMacro(slotsAnteriores.produto);
  const produtoMacroMensagemResolvido = normalizarProdutoMacro(prodMsg);
  const produtoMacroOrigemResolvido = normalizarProdutoMacro(prodOrigem);
  const produtoDeterministico = produtoMacroMensagemResolvido
    || produtoMacroAnteriorResolvido
    || produtoMacroOrigemResolvido;
  const produtoDeterministicoFonte = produtoMacroMensagemResolvido
    ? 'mensagem_cliente'
    : produtoMacroAnteriorResolvido
      ? 'estado_anterior'
      : produtoMacroOrigemResolvido
        ? 'anuncio'
        : null;
  const slotsParaProveniencia = {
    ...(decisao.slots || {}),
    ...(produtoDeterministico ? { produto: produtoDeterministico } : {}),
  };
'''
          s = s[:a] + resolver + s[b:]
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "patches/joao-slot-proveniencia-escrita/candidato/index.ts"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/joao-slot-proveniencia-escrita/candidato/index.ts
          git commit -m "fix(joao): aplicar precedencia estrita de produto"
          git push origin HEAD:joao-fix-produto-canonico-20260913
          echo "CORE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Rebuild replay candidato sobre o core novo
        shell: bash
        run: |
          git fetch --depth=1 origin b0d7bce7f08cda0392ccff9888123ce759b02bb9
          git show b0d7bce7f08cda0392ccff9888123ce759b02bb9:patches/joao-replay-hermetico-v288/harness.ts > patches/joao-replay-produto-candidato-20260913/harness.ts
          git show b0d7bce7f08cda0392ccff9888123ce759b02bb9:patches/joao-replay-hermetico-v288/composicao-v288.ts > patches/joao-replay-produto-candidato-20260913/composicao.ts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os

          core=os.environ['CORE_SHA']
          d=Path('patches/joao-replay-produto-candidato-20260913')
          cp=d/'composicao.ts'; hp=d/'harness.ts'
          c=cp.read_text(encoding='utf-8')
          old='0bd29b6563292368fa2968b903967fa5dea9be36/patches/joao-slot-proveniencia-escrita/candidato/index.ts'
          new=f'{core}/patches/joao-slot-proveniencia-escrita/candidato/index.ts'
          assert c.count(old)==1, c.count(old)
          c=c.replace(old,new,1)
          cp.write_text(c,encoding='utf-8')
          ch=hashlib.sha256(c.encode()).hexdigest()

          h=hp.read_text(encoding='utf-8')
          reps={
              "const HARNESS_VERSION = 'joao-replay-hermetico-v288/harness-v2';":"const HARNESS_VERSION = 'joao-replay-produto-candidato-20260913/harness-v3';",
              "const COMPOSICAO_SHA256 = 'b33776a0908ae7bf551a27512110446711e2a093d13bb97f9b763470bef7025b';":f"const COMPOSICAO_SHA256 = '{ch}';",
              "await import('./composicao-v288.ts');":"await import('./composicao.ts');",
              "  leituras: Leitura[];\n":"  leituras: Leitura[];\n  capturas_escrita?: any[];\n",
              "function bloquear(raw: string, metodo: string, motivo: string, alvo?: string) {":"function bloquear(raw: string, metodo: string, motivo: string, alvo?: string, input?: any, init?: any) {",
              "        if (d.decisao === 'BLOCK') return bloquear(raw, metodo, d.motivo, d.alvo);":"        if (d.decisao === 'BLOCK') return bloquear(raw, metodo, d.motivo, d.alvo, input, init);",
              "  return bloquear(raw, metodo, motivo, alvo);":"  return bloquear(raw, metodo, motivo, alvo, input, init);",
              "    bloqueios: st.bloqueios,\n":"    bloqueios: st.bloqueios,\n    capturas_escrita: st.capturas_escrita ?? [],\n",
          }
          for a,b in reps.items():
              assert h.count(a)==1,(a,h.count(a))
              h=h.replace(a,b,1)
          marker="    s.leituras.push({ alvo: alvo ?? raw, destino: 'BLOCK', filtro_aplicado: motivo });"
          assert h.count(marker)==1,h.count(marker)
          add=marker+"\n    if (alvo === 'agente_noturno_estado' || alvo === 'joao_slots_observacao' || alvo === 'error_log') {\n      let corpo: any = null;\n      try { const bruto = init?.body; corpo = typeof bruto === 'string' ? JSON.parse(bruto) : null; } catch { corpo = null; }\n      (s.capturas_escrita ??= []).push({ alvo, metodo, corpo });\n    }"
          h=h.replace(marker,add,1)
          hp.write_text(h,encoding='utf-8')
          (d/'META.txt').write_text(f'baseline_harness=b0d7bce7f08cda0392ccff9888123ce759b02bb9\ncandidate_core={core}\ncomposition_sha256={ch}\n',encoding='utf-8')
          PY

          printf '%s\n' '/// <reference lib="deno.ns" />' > /tmp/harness-check.ts
          cat patches/joao-replay-produto-candidato-20260913/harness.ts >> /tmp/harness-check.ts
          deno check --node-modules-dir=auto /tmp/harness-check.ts
          git diff --check

      - name: Commit replay candidato
        shell: bash
        run: |
          git add patches/joao-replay-produto-candidato-20260913/harness.ts patches/joao-replay-produto-candidato-20260913/composicao.ts patches/joao-replay-produto-candidato-20260913/META.txt
          git commit -m "test(joao): replay candidato v3 de precedencia estrita"
          git push origin HEAD:joao-fix-produto-canonico-20260913
