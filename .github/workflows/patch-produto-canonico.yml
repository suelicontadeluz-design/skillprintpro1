name: validate-produto-canonico-candidate

on:
  push:
    branches:
      - joao-fix-produto-canonico-20260913

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joao-fix-produto-canonico-20260913
          fetch-depth: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check core candidato no runtime Deno
        shell: bash
        run: |
          printf '%s\n' '/// <reference lib="deno.ns" />' > /tmp/joao-candidate-check.ts
          cat patches/joao-slot-proveniencia-escrita/candidato/index.ts >> /tmp/joao-candidate-check.ts
          deno check /tmp/joao-candidate-check.ts
      - name: Provar escopo do commit candidato
        shell: bash
        run: |
          files="$(git show --pretty='' --name-only 3f4505438ac63dc33b8aab5c3f5e3f4d171cfbc0)"
          test "$(printf '%s\n' "$files" | sed '/^$/d' | wc -l)" -eq 1
          test "$files" = "patches/joao-slot-proveniencia-escrita/candidato/index.ts"
          git show --check --stat --oneline 3f4505438ac63dc33b8aab5c3f5e3f4d171cfbc0
