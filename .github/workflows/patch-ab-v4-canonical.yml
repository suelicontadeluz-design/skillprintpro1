name: patch-ab-v4-canonical

on:
  push:
    branches:
      - joao-canonical-ab-v4-20260913

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joao-canonical-ab-v4-20260913
          fetch-depth: 1

      - name: Aplicar Candidate A+B v4 no core
        run: python3 .github/scripts/patch_ab_v4_canonical.py

      - name: Validar diff
        run: |
          git diff --check
          git diff --stat
          grep -q "produtoMacroAquisicaoResolvido" patches/joao-slot-proveniencia-escrita/candidato/index.ts
          grep -q "return t.length > 0" patches/joao-slot-proveniencia-escrita/candidato/index.ts

      - name: Commit canônico e limpar patch temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/joao-slot-proveniencia-escrita/candidato/index.ts
          git rm .github/workflows/patch-ab-v4-canonical.yml .github/scripts/patch_ab_v4_canonical.py
          git commit -m "fix(joao): canonicalizar Candidate A+B v4"
          git push origin HEAD:joao-canonical-ab-v4-20260913
