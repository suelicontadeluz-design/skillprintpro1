name: joao-replay-probe

on:
  workflow_dispatch:
  push:
    branches:
      - cortex/joao-replay-v4374
    paths:
      - '.github/workflows/joao-replay-probe.yml'
      - 'patches/joao-replay-hermetico-v4374/canario-5.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probes fail-closed e canario 5
        shell: bash
        env:
          URL: https://ldrdtaibazplvrbwyrvx.supabase.co/functions/v1/agente-noturno-replay
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlIiwicmVmIjoibGRyZHRhaWJhenBsdnJid3lydngiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc1MDgyNDcxNywiZXhwIjoyMDY2NDAwNzE3fQ.kw-_WEbgA2ehtnlsGAsXAtJW2ATDO_Eewanz7DFw3Vg
        run: |
          set -euo pipefail
          call() {
            body="$1"
            label="$2"
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$URL" -H "Authorization: Bearer $ANON" -H "apikey: $ANON" -H 'Content-Type: application/json' --data "$body")
            echo "=== $label ==="
            echo "HTTP $code"
            head -c 4000 "$out"
            echo
            rm -f "$out"
          }

          call '{"mode":"live"}' live
          call '{"mode":"shadow"}' shadow
          call '{"mode":"replay"}' replay_sem_caso
          call '{"mode":"replay","replay_case_id":"00000000-0000-0000-0000-000000000000"}' replay_caso_invalido

          echo '=== CANARIO 5 ==='
          n=0
          while read -r cid; do
            [ -n "$cid" ] || continue
            n=$((n+1))
            call "{\"mode\":\"replay\",\"replay_case_id\":\"$cid\"}" "canario_$n:$cid"
          done < <(jq -r '.casos[].replay_case_id' patches/joao-replay-hermetico-v4374/canario-5.json)
          echo "CANARIO_TOTAL=$n"
