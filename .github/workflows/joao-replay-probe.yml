name: joao-replay-probe

on:
  workflow_dispatch:
  push:
    branches:
      - cortex/joao-replay-v4374
    paths:
      - '.github/workflows/joao-replay-probe.yml'
      - 'patches/joao-replay-hermetico-v4374/canario-5.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probes fail-closed e canario 5
        shell: bash
        env:
          URL: https://ldrdtaibazplvrbwyrvx.supabase.co/functions/v1/agente-noturno-replay
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxkcmR0YWliYXpwbHZyYnd5cnZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTA4MjQ3MTcsImV4cCI6MjA2NjQwMDcxN30.kw-_WEbgA2ehtnlsGAsXAtJW2ATDO_Eewanz7DFw3Vg
        run: |
          set -euo pipefail
          call() {
            local body="$1"
            local label="$2"
            local out code
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST "$URL" \
              -H "Authorization: Bearer $ANON" \
              -H "apikey: $ANON" \
              -H 'Content-Type: application/json' \
              --data "$body")
            echo "=== $label ==="
            echo "HTTP $code"
            cat "$out" | head -c 4000
            echo
            rm -f "$out"
          }

          call '{"mode":"live"}' live
          call '{"mode":"shadow"}' shadow
          call '{"mode":"replay"}' replay_sem_caso
          call '{"mode":"replay","replay_case_id":"00000000-0000-0000-0000-000000000000"}' replay_caso_invalido

          echo '=== CANARIO 5 ==='
          python3 - <<'PY' > /tmp/cases.txt
import json
p='patches/joao-replay-hermetico-v4374/canario-5.json'
with open(p,encoding='utf-8') as f:
    x=json.load(f)
items=x if isinstance(x,list) else x.get('casos') or x.get('cases') or []
for it in items:
    if isinstance(it,str):
        print(it)
    else:
        cid=it.get('id') or it.get('caso_id') or it.get('replay_case_id')
        if cid: print(cid)
PY
          n=0
          while read -r cid; do
            [ -n "$cid" ] || continue
            n=$((n+1))
            call "{\"mode\":\"replay\",\"replay_case_id\":\"$cid\"}" "canario_$n:$cid"
          done < /tmp/cases.txt
          echo "CANARIO_TOTAL=$n"
