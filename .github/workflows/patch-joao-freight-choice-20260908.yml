name: Generate João freight choice patch

on:
  push:
    branches: [fix/joao-freight-choice-20260908]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/joao-freight-choice-20260908
      - name: Apply exact fail-closed freight choice patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('patches/joao-slot-proveniencia-escrita/candidato/index.ts')
          s = p.read_text()

          def one(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
              s = s.replace(old, new, 1)

          one(
              "const V = 'agente-noturno-v4.37.4-canonical-price';",
              "const V = 'agente-noturno-v4.37.5-freight-choice';",
              'agent version'
          )

          old_tool = "  { name: 'calcular_frete', description: 'Frete Correios por CEP de 8 digitos. CHAME de verdade, nunca prometa calcular depois.', input_schema: { type: 'object', properties: { cep_destino: { type: 'string' } }, required: ['cep_destino'] } },"
          new_tool = "  { name: 'calcular_frete', description: 'Frete por CEP de 8 digitos. PRIMEIRA chamada: envie somente cep_destino para COTAR e mostrar as opcoes; isso NAO cria autorizacao financeira. SOMENTE depois de o CLIENTE escolher explicitamente PAC, Sedex ou J&T Standard, chame de novo com cep_destino + servico_escolhido exatamente igual a opcao escolhida. Nunca escolha pelo cliente.', input_schema: { type: 'object', properties: { cep_destino: { type: 'string' }, servico_escolhido: { type: 'string', enum: ['PAC', 'Sedex', 'J&T Standard'] } }, required: ['cep_destino'] } },"
          one(old_tool, new_tool, 'tool schema')

          old_sig = "async function executarTool(name: string, input: any, ctx: { leadId: string | null; autorizacoes: any[]; cobrancaPendente: any | null; permiteMudanca: boolean; freteJa: any | null; arteParaCalculo?: { largura_cm: number; altura_cm: number; copias: number } | null; phone?: string; pixGerado?: any; holdArte?: boolean; modalidadeLogistica?: ModalidadeLogistica; produtoDigital?: boolean }): Promise<string> {"
          new_sig = "async function executarTool(name: string, input: any, ctx: { leadId: string | null; autorizacoes: any[]; cobrancaPendente: any | null; permiteMudanca: boolean; freteJa: any | null; arteParaCalculo?: { largura_cm: number; altura_cm: number; copias: number } | null; phone?: string; pixGerado?: any; holdArte?: boolean; modalidadeLogistica?: ModalidadeLogistica; produtoDigital?: boolean; mensagemCliente?: string }): Promise<string> {"
          one(old_sig, new_sig, 'tool ctx signature')

          one(
              "produtoDigital: estadoLog.produto_digital };",
              "produtoDigital: estadoLog.produto_digital, mensagemCliente: mensagem };",
              'ctx current inbound'
          )

          start_marker = "    if (name === 'calcular_frete') {\n"
          end_marker = "      return envelope([opF], dsp);\n    }"
          if s.count(start_marker) != 1:
              raise SystemExit(f'freight block start expected 1, got {s.count(start_marker)}')
          start = s.index(start_marker)
          end0 = s.index(end_marker, start)
          end = end0 + len(end_marker)
          old_block = s[start:end]
          if "const sedex = d.opcoes.find" not in old_block or "const melhor = sedex" not in old_block:
              raise SystemExit('old Sedex preselection logic not found in freight block')

          new_block = r'''    if (name === 'calcular_frete') {
      if (ctx.freteJa && !ctx.permiteMudanca) return JSON.stringify({ ok: true, financial_authorizations: [], display_data: { ja_calculado: true, servico: ctx.freteJa.servico_frete, preco: `R$${Number(ctx.freteJa.valor_frete).toFixed(2)}`, cep: ctx.freteJa.cep_destino, acao: 'Frete ja calculado. NAO recalcule.' } });
      const cep = String(input?.cep_destino || '').replace(/\D/g, '');
      if (cep.length !== 8) return JSON.stringify({ ok: false, erro: 'cep_invalido', acao: 'O CEP precisa ter 8 digitos. Peca o CEP completo.' });

      const canonServico = (v: unknown): string | null => {
        const raw = String(v ?? '').toLowerCase();
        const hits: string[] = [];
        if (/\bpac\b/i.test(raw)) hits.push('pac');
        if (/\bsedex\b/i.test(raw)) hits.push('sedex');
        if (/j\s*&\s*t|j\s+e\s+t|j\s+t\s+(?:standard|express)/i.test(raw)) hits.push('jt');
        return hits.length === 1 ? hits[0] : null;
      };
      const escolhaPedida = canonServico(input?.servico_escolhido);
      const escolhaCliente = canonServico(ctx.mensagemCliente);
      if (input?.servico_escolhido !== undefined && (!escolhaPedida || escolhaCliente !== escolhaPedida)) {
        await logErro('frete_escolha_sem_proveniencia_cliente', {
          lead: ctx.leadId, phone: String(ctx.phone || '').slice(-4),
          servico_pedido: String(input?.servico_escolhido || '').slice(0, 40),
          cliente_final: String(ctx.mensagemCliente || '').slice(0, 120),
        });
        return JSON.stringify({
          ok: false, erro: 'servico_frete_sem_escolha_cliente', financial_authorizations: [],
          acao: 'NAO escolha frete pelo cliente. Mostre as opcoes e aguarde ele escrever explicitamente PAC, Sedex ou J&T. So depois chame calcular_frete com servico_escolhido.'
        });
      }

      const r = await fetch(`${SUPABASE_URL}/functions/v1/calcular-frete`, { method: 'POST', headers: { 'content-type': 'application/json', Authorization: `Bearer ${SUPABASE_SERVICE_KEY}` }, body: JSON.stringify({ cep_destino: cep, metros: 1, valor_declarado: 60 }), signal: AbortSignal.timeout(12000) });
      const d = await r.json();
      if (!(d?.ok && Array.isArray(d.opcoes) && d.opcoes.length > 0)) return JSON.stringify({ ok: false, erro: 'sem_opcoes' });
      const opcoes = d.opcoes.map((o: any) => ({ servico: o.servico, preco: o.preco_formatado, prazo: o.prazo_formatado }));

      if (!escolhaPedida) {
        return envelope([], {
          opcoes, cep, quote_snapshot_id: d.quote_snapshot_id ?? null,
          instrucao: 'COTACAO APENAS. MANDE TODAS AS OPCOES AGORA com servico, preco e prazo e pergunte qual o cliente prefere. NAO existe autorizacao de frete ainda. NAO some total e NAO ofereca Pix/cartao antes da escolha.'
        });
      }

      const selecionada = d.opcoes.find((o: any) => canonServico(o?.servico) === escolhaPedida);
      if (!selecionada) return JSON.stringify({
        ok: false, erro: 'servico_frete_nao_cotado', financial_authorizations: [], opcoes,
        acao: 'A opcao escolhida pelo cliente nao apareceu nesta cotacao atual. Mostre as opcoes atuais e peca nova escolha; nao substitua por outra.'
      });

      const dsp = {
        opcoes, cep, quote_snapshot_id: d.quote_snapshot_id ?? null,
        servico_escolhido: selecionada.servico, preco_escolhido: selecionada.preco_formatado,
        prazo_escolhido: selecionada.prazo_formatado,
        instrucao: 'ESCOLHA DO CLIENTE CONFIRMADA. Use SOMENTE esta autorizacao de frete para compor_total com o produto. Nao troque o servico e nao use outra opcao.'
      };
      const opF = await emitirAutorizacao(ctx.leadId, 'frete', Math.round(Number(selecionada.preco) * 100) / 100, 'calcular_frete', { servico: selecionada.servico, cep, quote_snapshot_id: d.quote_snapshot_id ?? null, escolha_cliente: true });
      if (!opF) return falhaAutorizacao(dsp);
      return envelope([opF], dsp);
    }'''
          s = s[:start] + new_block + s[end:]

          # Main closeout rule: quote first, authorize only after explicit customer choice.
          old_close = "ENVIO: reutilize o CEP que voc\\u00ea j\\u00e1 tem, ou pe\\u00e7a UMA vez, e s\\u00f3 ent\\u00e3o calcular_frete -> TOTAL = produto + frete."
          new_close = "ENVIO: reutilize o CEP que voc\\u00ea j\\u00e1 tem, ou pe\\u00e7a UMA vez. Primeiro chame calcular_frete SO com o CEP para COTAR, mostre TODAS as opcoes e aguarde a escolha. So depois de o CLIENTE escrever explicitamente PAC, Sedex ou J&T, chame calcular_frete de novo com servico_escolhido -> TOTAL = produto + frete escolhido. NUNCA escolha frete pelo cliente."
          one(old_close, new_close, 'closeout prompt')

          # Output retry must recognize J&T as a legitimate freight service.
          one(
              "!/PAC|Sedex|SEDEX|frete/i.test(resposta)",
              "!/PAC|Sedex|SEDEX|J\\s*&\\s*T|J&T|frete/i.test(resposta)",
              'freight retry condition'
          )
          one(
              "/PAC|Sedex|SEDEX/i.test(r4)",
              "/PAC|Sedex|SEDEX|J\\s*&\\s*T|J&T/i.test(r4)",
              'freight retry acceptance'
          )

          # Static fail-closed assertions.
          if "const melhor = sedex" in s:
              raise SystemExit('Sedex preselection survived patch')
          if "servico_frete_sem_escolha_cliente" not in s:
              raise SystemExit('customer-choice provenance guard missing')
          if "return envelope([], {" not in s:
              raise SystemExit('quote-only zero-authorization path missing')
          if "escolha_cliente: true" not in s:
              raise SystemExit('selected freight authorization provenance missing')

          p.write_text(s)
          PY
      - name: Commit generated patch and retire generator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches/joao-slot-proveniencia-escrita/candidato/index.ts
          git rm .github/workflows/patch-joao-freight-choice-20260908.yml
          git commit -m "fix(joao): authorize only customer-selected freight"
          git push origin HEAD:fix/joao-freight-choice-20260908
