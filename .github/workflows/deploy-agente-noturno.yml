# Publica a Edge `agente-noturno` a partir do arquivo EXATO versionado neste
# repositorio, sem reconstruir o fonte. Disparo manual apenas.
#
# Pre-requisito: criar o secret SUPABASE_ACCESS_TOKEN
# (Settings > Secrets and variables > Actions > New repository secret)
# com um Personal Access Token do Supabase (sbp_...).

name: Deploy agente-noturno

on:
  workflow_dispatch:
    inputs:
      artefato:
        description: "O que publicar"
        required: true
        default: candidato
        type: choice
        options:
          - candidato
          - rollback_v166
      confirmar:
        description: "Digite PUBLICAR para confirmar"
        required: true
        default: ""

concurrency:
  group: deploy-agente-noturno
  cancel-in-progress: false

env:
  PROJECT_REF: ldrdtaibazplvrbwyrvx
  FUNCTION: agente-noturno
  SUPABASE_CLI_VERSION: "2.114.0"
  # SHA256 dos artefatos conferidos contra a v166 ACTIVE viva.
  SHA_CANDIDATO: 6e2116e26d44f0d6bf901a9f563fdeec1b72d036d3c4d4271653024c1edccdf3
  SHA_ROLLBACK: 6c3c90bf19af4c3f39be0b11584a763f0fedf20f5e870da6f03acd982b024764

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmacao explicita
        run: |
          if [ "${{ inputs.confirmar }}" != "PUBLICAR" ]; then
            echo "::error::Digite PUBLICAR no campo de confirmacao. Nada foi publicado."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Selecionar artefato
        run: |
          set -euo pipefail
          ALVO="supabase/functions/${FUNCTION}/index.ts"
          if [ "${{ inputs.artefato }}" = "rollback_v166" ]; then
            cp ".frentes/aprendizados-teto-descarte-total/v166_original_ROLLBACK.index.ts" "$ALVO"
            echo "SHA_ESPERADO=${SHA_ROLLBACK}" >> "$GITHUB_ENV"
            echo "Publicando ROLLBACK para a v166 original."
          else
            echo "SHA_ESPERADO=${SHA_CANDIDATO}" >> "$GITHUB_ENV"
            echo "Publicando o CANDIDATO (manifesto via RPC)."
          fi

      - name: Trava de integridade (SHA256)
        run: |
          set -euo pipefail
          ALVO="supabase/functions/${FUNCTION}/index.ts"
          ATUAL=$(sha256sum "$ALVO" | cut -d' ' -f1)
          echo "esperado: ${SHA_ESPERADO}"
          echo "atual   : ${ATUAL}"
          if [ "$ATUAL" != "$SHA_ESPERADO" ]; then
            echo "::error::SHA divergente. O artefato mudou desde a conferencia. Deploy abortado."
            exit 1
          fi
          echo "Integridade OK — $(wc -c < "$ALVO") bytes."

      - name: Deploy (preserva verify_jwt=false)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ausente no repositorio."
            exit 1
          fi
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy "${FUNCTION}" \
            --project-ref "${PROJECT_REF}" \
            --no-verify-jwt \
            --use-api

      - name: Post-flight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/functions/${FUNCTION}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ("slug","version","status","verify_jwt","entrypoint_path","ezbr_sha256")}, indent=2))'
